<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维差分具象化实验室</title>
<style>
:root{
    --bg:#edf2ef;
    --surface:#ffffff;
    --surface-soft:#f6f9f7;
    --ink:#17211d;
    --muted:#65716b;
    --line:#d4ddd8;
    --blue:#477bb7;
    --blue-soft:#dce9f7;
    --teal:#188779;
    --teal-soft:#d6eee9;
    --amber:#e3a239;
    --amber-soft:#faedcf;
    --coral:#dc664f;
    --coral-soft:#f8ddd7;
    --shadow:0 18px 50px rgba(34,51,43,.10);
}
*{box-sizing:border-box}
body{
    margin:0;
    min-width:320px;
    min-height:100vh;
    color:var(--ink);
    background:
        linear-gradient(rgba(23,33,29,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(23,33,29,.035) 1px,transparent 1px),
        var(--bg);
    background-size:28px 28px;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
}
button,input,select{font:inherit}
button{color:inherit}
.app{
    width:min(1500px,calc(100% - 34px));
    margin:17px auto 34px;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
}
.topbar{
    display:grid;
    grid-template-columns:minmax(280px,1fr) auto;
    gap:22px;
    align-items:center;
    padding:19px 24px 17px;
    border-bottom:1px solid var(--line);
}
.brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}
.brand-mark{
    width:44px;
    height:44px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:3px;
    padding:7px;
    background:var(--ink);
}
.brand-mark i{
    display:block;
    background:var(--surface);
}
.brand-mark i:nth-child(1){grid-column:1/3;grid-row:1}
.brand-mark i:nth-child(2){grid-column:2/4;grid-row:2}
.brand-mark i:nth-child(3){grid-column:1/3;grid-row:3}
h1{
    margin:0;
    font-size:28px;
    line-height:1.2;
    letter-spacing:0;
}
.brand p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:14px;
}
.phase-tabs{
    display:grid;
    grid-template-columns:repeat(3,minmax(142px,1fr));
    border:1px solid var(--line);
}
.phase-tab{
    min-height:52px;
    padding:8px 14px;
    border:0;
    border-right:1px solid var(--line);
    background:var(--surface);
    cursor:pointer;
    text-align:left;
}
.phase-tab:last-child{border-right:0}
.phase-tab strong,.phase-tab span{display:block}
.phase-tab strong{font-size:14px}
.phase-tab span{
    margin-top:2px;
    color:var(--muted);
    font-size:12px;
}
.phase-tab.active{
    color:#fff;
    background:var(--ink);
}
.phase-tab.active span{color:rgba(255,255,255,.68)}
.control-deck{
    display:grid;
    grid-template-columns:minmax(330px,1.3fr) minmax(420px,1.45fr) auto;
    gap:16px;
    align-items:end;
    padding:15px 24px;
    background:var(--surface-soft);
    border-bottom:1px solid var(--line);
}
.field label,.control-label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}
.operation-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(62px,1fr));
    gap:7px;
}
.input{
    width:100%;
    min-height:40px;
    border:1px solid #bdc8c2;
    border-radius:4px;
    background:#fff;
    padding:8px 10px;
    outline:none;
}
.input:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(24,135,121,.14);
}
.action-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}
.btn{
    min-height:40px;
    border:1px solid #bdc8c2;
    border-radius:4px;
    background:#fff;
    padding:8px 13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}
.btn:hover:not(:disabled){background:#eef3f0}
.btn.primary{
    border-color:var(--ink);
    color:#fff;
    background:var(--ink);
}
.btn.primary:hover:not(:disabled){background:#2b3933}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;padding:0;font-size:20px}
.speed{width:86px}
.feedback{
    display:none;
    grid-column:1/-1;
    color:#a53d2d;
    font-size:13px;
}
.feedback.show{display:block}
.stage-head{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:16px;
    align-items:center;
    min-height:68px;
    padding:13px 24px;
    border-bottom:1px solid var(--line);
}
.step-kicker{
    color:var(--muted);
    font-size:12px;
}
.step-kicker strong{
    display:block;
    margin-top:3px;
    color:var(--ink);
    font-size:15px;
}
.formula-live{
    min-width:0;
    font-family:Consolas,"Courier New",monospace;
    font-size:17px;
    font-weight:700;
    text-align:center;
    overflow-wrap:anywhere;
}
.status-chip{
    min-width:116px;
    padding:7px 10px;
    color:var(--muted);
    background:var(--surface-soft);
    border:1px solid var(--line);
    text-align:center;
    font-size:12px;
}
.status-chip.busy{
    color:var(--teal);
    background:var(--teal-soft);
    border-color:#a9d6cd;
}
.boards{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    border-bottom:1px solid var(--line);
}
.board{
    min-width:0;
    border-right:1px solid var(--line);
    transition:background .25s ease;
}
.board:last-child{border-right:0}
.board.focus{background:rgba(24,135,121,.025)}
.board-head{
    min-height:84px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:start;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
}
.board-kicker{
    display:block;
    margin-bottom:5px;
    color:var(--muted);
    font-family:Consolas,"Courier New",monospace;
    font-size:11px;
}
.board-head h2{
    margin:0;
    font-size:17px;
    letter-spacing:0;
}
.board-meta{
    max-width:150px;
    color:var(--muted);
    font-size:11px;
    text-align:right;
    line-height:1.45;
}
.matrix-viewport{
    min-height:390px;
    overflow:auto;
    padding:28px 20px 24px;
}
.matrix-with-axis{
    --rows:4;
    --cols:5;
    display:grid;
    grid-template-columns:25px minmax(calc(var(--cols) * 54px),1fr);
    grid-template-rows:22px auto;
    gap:6px;
    min-width:calc(var(--cols) * 54px + 31px);
}
.axis-corner{grid-column:1;grid-row:1}
.col-axis{
    grid-column:2;
    grid-row:1;
    display:grid;
    grid-template-columns:repeat(var(--cols),1fr);
    gap:7px;
}
.row-axis{
    grid-column:1;
    grid-row:2;
    display:grid;
    grid-template-rows:repeat(var(--rows),1fr);
    gap:7px;
}
.axis-label{
    display:grid;
    place-items:center;
    color:var(--muted);
    font-family:Consolas,"Courier New",monospace;
    font-size:10px;
}
.matrix-grid{
    grid-column:2;
    grid-row:2;
    position:relative;
    display:grid;
    grid-template-columns:repeat(var(--cols),minmax(47px,1fr));
    grid-template-rows:repeat(var(--rows),minmax(47px,1fr));
    gap:7px;
}
.matrix-cell{
    position:relative;
    aspect-ratio:1;
    min-width:47px;
    min-height:47px;
    display:grid;
    place-items:center;
    border:1px solid #cbd4cf;
    background:#fff;
    overflow:visible;
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.cell-heat{
    position:absolute;
    inset:0;
    background:var(--blue);
    opacity:var(--heat,.15);
    pointer-events:none;
}
.cell-value{
    position:relative;
    z-index:3;
    font-family:Consolas,"Courier New",monospace;
    font-size:17px;
    font-weight:700;
    white-space:nowrap;
}
.matrix-cell.processed{border-color:#8fb5dc}
.matrix-cell.in-region{
    border-color:var(--amber);
    box-shadow:inset 0 0 0 2px rgba(227,162,57,.28);
}
.matrix-cell.in-region .cell-heat{background:var(--amber);opacity:.34}
.matrix-cell.changed .cell-heat{background:var(--teal);opacity:.54}
.matrix-cell.compare{
    z-index:5;
    transform:translateY(-5px);
    border:2px solid var(--ink);
    box-shadow:0 7px 0 rgba(23,33,29,.12);
}
.matrix-cell.term-plus{background:var(--teal-soft)}
.matrix-cell.term-minus{background:var(--coral-soft)}
.term-badge{
    position:absolute;
    z-index:8;
    left:3px;
    top:3px;
    min-width:18px;
    height:18px;
    display:grid;
    place-items:center;
    color:#fff;
    background:var(--ink);
    font-family:Consolas,"Courier New",monospace;
    font-size:11px;
    font-weight:700;
}
.cell-coordinate{
    position:absolute;
    z-index:4;
    right:3px;
    bottom:2px;
    color:rgba(23,33,29,.52);
    font-family:Consolas,"Courier New",monospace;
    font-size:8px;
}
.diff-cell{
    background:var(--surface-soft);
}
.diff-cell.hidden .cell-value{color:#a8b2ad}
.diff-cell.positive.revealed{
    background:var(--teal-soft);
    border-color:#9dcec5;
}
.diff-cell.negative.revealed{
    background:var(--coral-soft);
    border-color:#e1a99d;
}
.diff-cell.zero.revealed{background:#edf1ee}
.diff-cell.active{
    z-index:6;
    transform:translateY(-5px) scale(1.03);
    border:2px solid var(--ink);
}
.diff-cell.corner-plus{
    background:var(--amber-soft);
    border:2px solid var(--amber);
}
.diff-cell.corner-minus{
    background:var(--coral-soft);
    border:2px solid var(--coral);
}
.corner-tag{
    position:absolute;
    z-index:10;
    left:50%;
    top:-14px;
    transform:translateX(-50%);
    padding:2px 5px;
    color:#fff;
    background:var(--ink);
    font-size:9px;
    white-space:nowrap;
}
.corner-delta{
    position:absolute;
    z-index:10;
    right:2px;
    top:2px;
    color:#8b5708;
    font-family:Consolas,"Courier New",monospace;
    font-size:10px;
    font-weight:700;
}
.corner-minus .corner-delta{color:#b6422f}
.restore-cell.empty{
    border-style:dashed;
    background:rgba(213,221,216,.16);
}
.restore-cell.revealed .cell-heat{background:var(--teal)}
.restore-cell.current{
    z-index:6;
    transform:translateY(-5px);
    border:2px solid var(--amber);
    box-shadow:0 7px 0 rgba(227,162,57,.18);
}
.restore-cell.contributor{
    border:2px solid var(--blue);
}
.match-mark{
    position:absolute;
    z-index:8;
    right:3px;
    top:2px;
    color:var(--teal);
    font-size:11px;
    font-weight:700;
}
.flying-token{
    position:fixed;
    z-index:9999;
    display:grid;
    place-items:center;
    border:2px solid var(--ink);
    color:#fff;
    background:var(--teal);
    font-family:Consolas,"Courier New",monospace;
    font-size:13px;
    font-weight:700;
    pointer-events:none;
    box-shadow:0 5px 0 rgba(23,33,29,.18);
}
.flying-token.minus{background:var(--coral)}
.legend-row{
    display:flex;
    align-items:center;
    gap:17px;
    flex-wrap:wrap;
    padding:12px 24px;
    color:var(--muted);
    background:var(--surface-soft);
    font-size:12px;
}
.legend-item{
    display:inline-flex;
    align-items:center;
    gap:6px;
}
.swatch{
    width:14px;
    height:14px;
    display:inline-block;
}
.swatch.plus{background:var(--teal-soft);border:1px solid var(--teal)}
.swatch.minus{background:var(--coral-soft);border:1px solid var(--coral)}
.swatch.region{background:var(--amber-soft);border:2px solid var(--amber)}
.swatch.restored{background:var(--teal);border:1px solid #0f695f}
.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}
@media(max-width:1180px){
    .control-deck{grid-template-columns:1fr 1fr}
    .action-row{grid-column:1/-1;justify-content:flex-start}
    .boards{grid-template-columns:1fr}
    .board{
        border-right:0;
        border-bottom:1px solid var(--line);
    }
    .board:last-child{border-bottom:0}
    .matrix-viewport{min-height:0}
}
@media(max-width:820px){
    .topbar{grid-template-columns:1fr}
    .phase-tabs{grid-template-columns:1fr}
    .phase-tab{
        border-right:0;
        border-bottom:1px solid var(--line);
    }
    .phase-tab:last-child{border-bottom:0}
}
@media(max-width:680px){
    .app{
        width:100%;
        margin:0;
        border-left:0;
        border-right:0;
    }
    .topbar,.control-deck,.stage-head{padding-left:14px;padding-right:14px}
    .control-deck{grid-template-columns:1fr}
    .action-row{grid-column:auto}
    .operation-grid{grid-template-columns:repeat(5,minmax(52px,1fr))}
    .stage-head{grid-template-columns:1fr auto}
    .formula-live{
        grid-column:1/-1;
        grid-row:2;
        text-align:left;
        font-size:14px;
    }
    .board-head{padding-left:14px;padding-right:14px}
    .matrix-viewport{padding:22px 14px}
    .legend-row{padding:12px 14px}
    h1{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>
<body>
<main class="app">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <div>
                <h1>二维差分 · 四个角控制一整块</h1>
                <p>观察四项容斥如何形成差分，以及四个端点怎样改变一个矩形区域。</p>
            </div>
        </div>
        <nav class="phase-tabs" aria-label="演示阶段">
            <button class="phase-tab active" data-phase="build">
                <strong>01 构造差分</strong>
                <span id="buildTabState">等待开始</span>
            </button>
            <button class="phase-tab" data-phase="update">
                <strong>02 矩形修改</strong>
                <span id="updateTabState">四角尚未改变</span>
            </button>
            <button class="phase-tab" data-phase="restore">
                <strong>03 二维前缀还原</strong>
                <span id="restoreTabState">等待还原</span>
            </button>
        </nav>
    </header>

    <section class="control-deck" aria-label="矩阵与播放控制">
        <div class="field">
            <label for="matrixInput">原矩阵（分号换行，逗号分列）</label>
            <input class="input" id="matrixInput" value="3,3,5,5,5; 3,6,8,8,5; 3,6,8,4,4; 2,2,4,4,4" autocomplete="off">
        </div>
        <div>
            <span class="control-label">矩形 [x1,y1] 到 [x2,y2] 全部加 Δ</span>
            <div class="operation-grid">
                <label class="sr-only" for="x1Input">x1</label>
                <input class="input" id="x1Input" type="number" value="1" min="0" aria-label="x1">
                <label class="sr-only" for="y1Input">y1</label>
                <input class="input" id="y1Input" type="number" value="1" min="0" aria-label="y1">
                <label class="sr-only" for="x2Input">x2</label>
                <input class="input" id="x2Input" type="number" value="2" min="0" aria-label="x2">
                <label class="sr-only" for="y2Input">y2</label>
                <input class="input" id="y2Input" type="number" value="3" min="0" aria-label="y2">
                <label class="sr-only" for="deltaInput">变化量 delta</label>
                <input class="input" id="deltaInput" type="number" value="3" aria-label="变化量 delta">
            </div>
        </div>
        <div class="action-row">
            <label class="sr-only" for="speedSelect">动画速度</label>
            <select class="input speed" id="speedSelect" aria-label="动画速度">
                <option value="1.3">慢速</option>
                <option value="1" selected>标准</option>
                <option value=".62">快速</option>
            </select>
            <button class="btn" id="loadBtn">载入</button>
            <button class="btn" id="secondaryBtn">单步汇入</button>
            <button class="btn primary" id="primaryBtn">播放构造</button>
            <button class="btn icon-btn" id="resetBtn" aria-label="重置全部" title="重置全部">↻</button>
        </div>
        <div class="feedback" id="feedback" role="alert"></div>
    </section>

    <section class="stage-head" aria-live="polite">
        <div class="step-kicker">
            当前观察
            <strong id="observation">四项容斥</strong>
        </div>
        <div class="formula-live" id="formulaLive">d[i][j] = 当前 - 上 - 左 + 左上</div>
        <div class="status-chip" id="statusChip">准备就绪</div>
    </section>

    <section class="boards" aria-label="二维差分对比画布">
        <section class="board focus" id="sourceBoard">
            <header class="board-head">
                <div>
                    <span class="board-kicker">SOURCE MATRIX</span>
                    <h2>原矩阵 a</h2>
                </div>
                <div class="board-meta" id="sourceMeta">数值越大，色块越深</div>
            </header>
            <div class="matrix-viewport">
                <div class="matrix-with-axis" id="sourceFrame">
                    <span class="axis-corner"></span>
                    <div class="col-axis"></div>
                    <div class="row-axis"></div>
                    <div class="matrix-grid" id="sourceGrid" role="img" aria-label="原矩阵"></div>
                </div>
            </div>
        </section>

        <section class="board" id="diffBoard">
            <header class="board-head">
                <div>
                    <span class="board-kicker">2D DIFFERENCE</span>
                    <h2>差分矩阵 d</h2>
                </div>
                <div class="board-meta" id="diffMeta">等待四项汇入</div>
            </header>
            <div class="matrix-viewport">
                <div class="matrix-with-axis" id="diffFrame">
                    <span class="axis-corner"></span>
                    <div class="col-axis"></div>
                    <div class="row-axis"></div>
                    <div class="matrix-grid" id="diffGrid" role="img" aria-label="二维差分矩阵"></div>
                </div>
            </div>
        </section>

        <section class="board" id="restoreBoard">
            <header class="board-head">
                <div>
                    <span class="board-kicker">2D PREFIX RESTORE</span>
                    <h2>二维前缀还原</h2>
                </div>
                <div class="board-meta" id="restoreMeta">等待逐格重建</div>
            </header>
            <div class="matrix-viewport">
                <div class="matrix-with-axis" id="restoreFrame">
                    <span class="axis-corner"></span>
                    <div class="col-axis"></div>
                    <div class="row-axis"></div>
                    <div class="matrix-grid" id="restoreGrid" role="img" aria-label="二维前缀还原矩阵"></div>
                </div>
            </div>
        </section>
    </section>

    <footer class="legend-row">
        <span class="legend-item"><i class="swatch plus"></i>加入：当前、左上</span>
        <span class="legend-item"><i class="swatch minus"></i>减去：上方、左侧</span>
        <span class="legend-item"><i class="swatch region"></i>四角控制的矩形区域</span>
        <span class="legend-item"><i class="swatch restored"></i>已由二维前缀和还原</span>
    </footer>
</main>

<script>
const els = {
    matrixInput: document.getElementById('matrixInput'),
    x1Input: document.getElementById('x1Input'),
    y1Input: document.getElementById('y1Input'),
    x2Input: document.getElementById('x2Input'),
    y2Input: document.getElementById('y2Input'),
    deltaInput: document.getElementById('deltaInput'),
    speedSelect: document.getElementById('speedSelect'),
    loadBtn: document.getElementById('loadBtn'),
    secondaryBtn: document.getElementById('secondaryBtn'),
    primaryBtn: document.getElementById('primaryBtn'),
    resetBtn: document.getElementById('resetBtn'),
    feedback: document.getElementById('feedback'),
    observation: document.getElementById('observation'),
    formulaLive: document.getElementById('formulaLive'),
    statusChip: document.getElementById('statusChip'),
    sourceBoard: document.getElementById('sourceBoard'),
    diffBoard: document.getElementById('diffBoard'),
    restoreBoard: document.getElementById('restoreBoard'),
    sourceFrame: document.getElementById('sourceFrame'),
    diffFrame: document.getElementById('diffFrame'),
    restoreFrame: document.getElementById('restoreFrame'),
    sourceGrid: document.getElementById('sourceGrid'),
    diffGrid: document.getElementById('diffGrid'),
    restoreGrid: document.getElementById('restoreGrid'),
    sourceMeta: document.getElementById('sourceMeta'),
    diffMeta: document.getElementById('diffMeta'),
    restoreMeta: document.getElementById('restoreMeta'),
    buildTabState: document.getElementById('buildTabState'),
    updateTabState: document.getElementById('updateTabState'),
    restoreTabState: document.getElementById('restoreTabState')
};

const defaults = {
    matrixText: '3,3,5,5,5; 3,6,8,8,5; 3,6,8,4,4; 2,2,4,4,4',
    x1: 1,
    y1: 1,
    x2: 2,
    y2: 3,
    delta: 3
};

const state = {
    base: [],
    baseDiff: [],
    workingDiff: [],
    updated: [],
    rows: 0,
    cols: 0,
    phase: 'build',
    builtCount: 0,
    compare: null,
    compareStage: 'idle',
    updateApplied: false,
    appliedCornerCount: 0,
    activeCorner: null,
    changeAnimating: false,
    restored: [],
    restoreCount: 0,
    restoreCurrent: null,
    busy: false,
    token: 0
};

function parseMatrix(text) {
    const rowTexts = text.trim().split(/[;\n]+/).map(row => row.trim()).filter(Boolean);
    const matrix = rowTexts.map(row => row.split(/[\s,，]+/).filter(Boolean).map(Number));
    const rows = matrix.length;
    const cols = matrix[0]?.length || 0;
    const invalid = rows < 2 || rows > 5 || cols < 2 || cols > 6 ||
        matrix.some(row => row.length !== cols) ||
        matrix.flat().some(value => !Number.isInteger(value) || value < 0 || value > 30);
    if (invalid) {
        throw new Error('请输入 2～5 行、2～6 列的整齐矩阵，元素需为 0～30 的整数。');
    }
    return matrix;
}

function emptyMatrix(rows, cols, value = null) {
    return Array.from({length:rows}, () => Array(cols).fill(value));
}

function cloneMatrix(matrix) {
    return matrix.map(row => [...row]);
}

function buildDiff(matrix) {
    const rows = matrix.length;
    const cols = matrix[0].length;
    const diff = emptyMatrix(rows, cols, 0);
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const up = r > 0 ? matrix[r - 1][c] : 0;
            const left = c > 0 ? matrix[r][c - 1] : 0;
            const diagonal = r > 0 && c > 0 ? matrix[r - 1][c - 1] : 0;
            diff[r][c] = matrix[r][c] - up - left + diagonal;
        }
    }
    return diff;
}

function readOperation() {
    const rawX1 = Number(els.x1Input.value);
    const rawY1 = Number(els.y1Input.value);
    const rawX2 = Number(els.x2Input.value);
    const rawY2 = Number(els.y2Input.value);
    const delta = Number(els.deltaInput.value);
    if (![rawX1,rawY1,rawX2,rawY2,delta].every(Number.isInteger)) {
        throw new Error('x1、y1、x2、y2 和 Δ 都需要是整数。');
    }
    const x1 = Math.min(rawX1, rawX2);
    const x2 = Math.max(rawX1, rawX2);
    const y1 = Math.min(rawY1, rawY2);
    const y2 = Math.max(rawY1, rawY2);
    if (x1 < 0 || x2 >= state.rows || y1 < 0 || y2 >= state.cols) {
        throw new Error(`行范围为 0～${state.rows - 1}，列范围为 0～${state.cols - 1}。`);
    }
    if (delta < -20 || delta > 20) throw new Error('Δ 请控制在 -20～20 之间。');
    const next = state.base.map((row,r) => row.map((value,c) => {
        return r >= x1 && r <= x2 && c >= y1 && c <= y2 ? value + delta : value;
    }));
    if (next.flat().some(value => value < 0 || value > 40)) {
        throw new Error('修改后矩阵元素需保持在 0～40 之间，请调整 Δ。');
    }
    return {x1,y1,x2,y2,delta,next};
}

function cornerOperations(operation) {
    const corners = [
        {r:operation.x1,c:operation.y1,delta:operation.delta,label:'左上'},
    ];
    if (operation.y2 + 1 < state.cols) {
        corners.push({r:operation.x1,c:operation.y2 + 1,delta:-operation.delta,label:'右上'});
    }
    if (operation.x2 + 1 < state.rows) {
        corners.push({r:operation.x2 + 1,c:operation.y1,delta:-operation.delta,label:'左下'});
    }
    if (operation.x2 + 1 < state.rows && operation.y2 + 1 < state.cols) {
        corners.push({r:operation.x2 + 1,c:operation.y2 + 1,delta:operation.delta,label:'右下'});
    }
    return corners;
}

function showError(message) {
    els.feedback.textContent = message;
    els.feedback.classList.add('show');
}

function clearError() {
    els.feedback.textContent = '';
    els.feedback.classList.remove('show');
}

function duration(ms) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return 1;
    return Math.max(1, ms * Number(els.speedSelect.value));
}

function wait(ms, token = state.token) {
    return new Promise(resolve => {
        window.setTimeout(() => resolve(token === state.token), duration(ms));
    });
}

function signed(value) {
    return value > 0 ? `+${value}` : String(value);
}

function currentOperation(silent = true) {
    try {
        return readOperation();
    } catch (error) {
        if (!silent) showError(error.message);
        return {x1:0,y1:0,x2:state.rows - 1,y2:state.cols - 1,delta:0,next:cloneMatrix(state.base)};
    }
}

function setFrameSize(frame) {
    frame.style.setProperty('--rows',state.rows);
    frame.style.setProperty('--cols',state.cols);
    const colAxis = frame.querySelector('.col-axis');
    const rowAxis = frame.querySelector('.row-axis');
    colAxis.innerHTML = '';
    rowAxis.innerHTML = '';
    for (let c = 0; c < state.cols; c++) colAxis.appendChild(axisLabel(c));
    for (let r = 0; r < state.rows; r++) rowAxis.appendChild(axisLabel(r));
}

function axisLabel(value) {
    const label = document.createElement('span');
    label.className = 'axis-label';
    label.textContent = value;
    return label;
}

function resetState(matrix) {
    state.token++;
    state.base = cloneMatrix(matrix);
    state.baseDiff = buildDiff(matrix);
    state.workingDiff = cloneMatrix(state.baseDiff);
    state.updated = cloneMatrix(matrix);
    state.rows = matrix.length;
    state.cols = matrix[0].length;
    state.phase = 'build';
    state.builtCount = 0;
    state.compare = null;
    state.compareStage = 'idle';
    state.updateApplied = false;
    state.appliedCornerCount = 0;
    state.activeCorner = null;
    state.changeAnimating = false;
    state.restored = emptyMatrix(state.rows,state.cols,null);
    state.restoreCount = 0;
    state.restoreCurrent = null;
    state.busy = false;
    [els.sourceFrame,els.diffFrame,els.restoreFrame].forEach(setFrameSize);
    clearError();
    render();
}

function loadFromInput() {
    try {
        const matrix = parseMatrix(els.matrixInput.value);
        els.x1Input.max = els.x2Input.max = String(matrix.length - 1);
        els.y1Input.max = els.y2Input.max = String(matrix[0].length - 1);
        if (Number(els.x1Input.value) >= matrix.length) els.x1Input.value = '0';
        if (Number(els.x2Input.value) >= matrix.length) els.x2Input.value = String(matrix.length - 1);
        if (Number(els.y1Input.value) >= matrix[0].length) els.y1Input.value = '0';
        if (Number(els.y2Input.value) >= matrix[0].length) els.y2Input.value = String(matrix[0].length - 1);
        resetState(matrix);
    } catch (error) {
        showError(error.message);
    }
}

function resetAll() {
    els.matrixInput.value = defaults.matrixText;
    els.x1Input.value = defaults.x1;
    els.y1Input.value = defaults.y1;
    els.x2Input.value = defaults.x2;
    els.y2Input.value = defaults.y2;
    els.deltaInput.value = defaults.delta;
    loadFromInput();
}

function sourceValues() {
    return state.updateApplied ? state.updated : state.base;
}

function heatOpacity(value) {
    const max = Math.max(1,...state.base.flat(),...state.updated.flat());
    return Math.min(.66,.12 + value / max * .5).toFixed(2);
}

function cellKey(r,c) {
    return `${r},${c}`;
}

function sourceTermAt(r,c) {
    if (!state.compare || state.compareStage === 'idle') return null;
    const cr = state.compare.r;
    const cc = state.compare.c;
    if (r === cr && c === cc) return {sign:'+',label:'当前'};
    if (r === cr - 1 && c === cc) return {sign:'−',label:'上'};
    if (r === cr && c === cc - 1) return {sign:'−',label:'左'};
    if (r === cr - 1 && c === cc - 1) return {sign:'+',label:'左上'};
    return null;
}

function renderSource() {
    const operation = currentOperation();
    const values = sourceValues();
    els.sourceGrid.innerHTML = '';
    for (let r = 0; r < state.rows; r++) {
        for (let c = 0; c < state.cols; c++) {
            const cell = document.createElement('div');
            cell.className = 'matrix-cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            if (r * state.cols + c < state.builtCount) cell.classList.add('processed');
            const inRegion = (state.phase === 'update' || state.updateApplied) &&
                r >= operation.x1 && r <= operation.x2 && c >= operation.y1 && c <= operation.y2;
            if (inRegion) cell.classList.add('in-region');
            if (state.updateApplied && inRegion) cell.classList.add('changed');

            const term = sourceTermAt(r,c);
            if (term) {
                cell.classList.add('compare',term.sign === '+' ? 'term-plus' : 'term-minus');
                const badge = document.createElement('span');
                badge.className = 'term-badge';
                badge.textContent = term.sign;
                cell.appendChild(badge);
            }

            const heat = document.createElement('span');
            heat.className = 'cell-heat';
            heat.style.setProperty('--heat',heatOpacity(values[r][c]));
            const value = document.createElement('span');
            value.className = 'cell-value';
            if (state.changeAnimating && inRegion) value.textContent = `${state.base[r][c]}→${state.updated[r][c]}`;
            else value.textContent = values[r][c];
            const coordinate = document.createElement('span');
            coordinate.className = 'cell-coordinate';
            coordinate.textContent = `${r},${c}`;
            cell.appendChild(heat);
            cell.appendChild(value);
            cell.appendChild(coordinate);
            els.sourceGrid.appendChild(cell);
        }
    }
}

function renderDiff() {
    const operation = currentOperation();
    const corners = cornerOperations(operation);
    els.diffGrid.innerHTML = '';
    for (let r = 0; r < state.rows; r++) {
        for (let c = 0; c < state.cols; c++) {
            const value = state.workingDiff[r][c];
            const index = r * state.cols + c;
            const revealed = index < state.builtCount || state.phase !== 'build' ||
                state.updateApplied || state.appliedCornerCount > 0;
            const cell = document.createElement('div');
            const signClass = value > 0 ? 'positive' : value < 0 ? 'negative' : 'zero';
            cell.className = `matrix-cell diff-cell ${revealed ? `revealed ${signClass}` : 'hidden'}`;
            cell.dataset.r = r;
            cell.dataset.c = c;
            if (state.compare && state.compare.r === r && state.compare.c === c) cell.classList.add('active');
            if (state.restoreCurrent && state.restoreCurrent.r === r && state.restoreCurrent.c === c) cell.classList.add('active');

            corners.forEach((corner,cornerIndex) => {
                const applied = cornerIndex < state.appliedCornerCount || state.updateApplied;
                if (applied && corner.r === r && corner.c === c) {
                    cell.classList.add(corner.delta >= 0 ? 'corner-plus' : 'corner-minus');
                    const tag = document.createElement('span');
                    tag.className = 'corner-tag';
                    tag.textContent = corner.label;
                    const delta = document.createElement('span');
                    delta.className = 'corner-delta';
                    delta.textContent = signed(corner.delta);
                    cell.appendChild(tag);
                    cell.appendChild(delta);
                }
            });

            const valueEl = document.createElement('span');
            valueEl.className = 'cell-value';
            valueEl.textContent = revealed ? signed(value) : '?';
            const coordinate = document.createElement('span');
            coordinate.className = 'cell-coordinate';
            coordinate.textContent = `${r},${c}`;
            cell.appendChild(valueEl);
            cell.appendChild(coordinate);
            els.diffGrid.appendChild(cell);
        }
    }
}

function isRestoreContributor(r,c) {
    if (!state.restoreCurrent) return false;
    const cr = state.restoreCurrent.r;
    const cc = state.restoreCurrent.c;
    return (r === cr - 1 && c === cc) ||
        (r === cr && c === cc - 1) ||
        (r === cr - 1 && c === cc - 1);
}

function renderRestore() {
    const operation = currentOperation();
    els.restoreGrid.innerHTML = '';
    for (let r = 0; r < state.rows; r++) {
        for (let c = 0; c < state.cols; c++) {
            const value = state.restored[r][c];
            const cell = document.createElement('div');
            cell.className = `matrix-cell restore-cell ${value === null ? 'empty' : 'revealed'}`;
            cell.dataset.r = r;
            cell.dataset.c = c;
            const inRegion = state.updateApplied && r >= operation.x1 && r <= operation.x2 &&
                c >= operation.y1 && c <= operation.y2;
            if (inRegion) cell.classList.add('in-region');
            if (state.restoreCurrent && state.restoreCurrent.r === r && state.restoreCurrent.c === c) {
                cell.classList.add('current');
            }
            if (isRestoreContributor(r,c)) cell.classList.add('contributor');
            if (value !== null) {
                const heat = document.createElement('span');
                heat.className = 'cell-heat';
                heat.style.setProperty('--heat',heatOpacity(value));
                const valueEl = document.createElement('span');
                valueEl.className = 'cell-value';
                valueEl.textContent = value;
                cell.appendChild(heat);
                cell.appendChild(valueEl);
                if (value === sourceValues()[r][c]) {
                    const match = document.createElement('span');
                    match.className = 'match-mark';
                    match.textContent = '✓';
                    cell.appendChild(match);
                }
            }
            const coordinate = document.createElement('span');
            coordinate.className = 'cell-coordinate';
            coordinate.textContent = `${r},${c}`;
            cell.appendChild(coordinate);
            els.restoreGrid.appendChild(cell);
        }
    }
}

function sourceValue(r,c) {
    return r >= 0 && c >= 0 ? state.base[r][c] : 0;
}

function restoreValue(r,c) {
    return r >= 0 && c >= 0 ? state.restored[r][c] ?? 0 : 0;
}

function renderHeader() {
    document.querySelectorAll('.phase-tab').forEach(button => {
        button.classList.toggle('active',button.dataset.phase === state.phase);
    });
    els.sourceBoard.classList.toggle('focus',state.phase === 'build' || state.phase === 'update');
    els.diffBoard.classList.toggle('focus',state.phase === 'build' || state.phase === 'update');
    els.restoreBoard.classList.toggle('focus',state.phase === 'restore');

    const total = state.rows * state.cols;
    els.buildTabState.textContent = state.builtCount === total ? '差分已完整出现' : `已汇入 ${state.builtCount}/${total}`;
    els.updateTabState.textContent = state.updateApplied ? '四角修改已生效' : '四角尚未改变';
    els.restoreTabState.textContent = state.restoreCount === total ? '已与原矩阵一致' : `已还原 ${state.restoreCount}/${total}`;

    if (state.phase === 'build') {
        els.primaryBtn.textContent = state.builtCount === total ? '重新播放构造' : '播放构造';
        els.secondaryBtn.textContent = '单步汇入';
    } else if (state.phase === 'update') {
        els.primaryBtn.textContent = state.updateApplied ? '重新执行修改' : '执行四角修改';
        els.secondaryBtn.textContent = '恢复修改前';
    } else {
        els.primaryBtn.textContent = state.restoreCount === total ? '重新播放还原' : '播放还原';
        els.secondaryBtn.textContent = '单步还原';
    }
    [els.primaryBtn,els.secondaryBtn,els.loadBtn].forEach(button => button.disabled = state.busy);
    els.statusChip.classList.toggle('busy',state.busy);
    els.statusChip.textContent = state.busy ? '动画进行中' : '可操作';

    const operation = currentOperation();
    els.sourceMeta.textContent = state.updateApplied
        ? `[${operation.x1},${operation.y1}] 到 [${operation.x2},${operation.y2}] 每格 ${signed(operation.delta)}`
        : '数值越大，色块越深';
    els.diffMeta.textContent = state.updateApplied
        ? `${cornerOperations(operation).length} 个有效角点`
        : state.builtCount === total ? '正负变化已记录' : '等待四项汇入';
    els.restoreMeta.textContent = state.restoreCount === total
        ? `${total} 个格子全部匹配`
        : `已重建 ${state.restoreCount}/${total}`;

    if (state.phase === 'build') {
        if (state.compare) {
            const r = state.compare.r;
            const c = state.compare.c;
            const current = sourceValue(r,c);
            const up = sourceValue(r - 1,c);
            const left = sourceValue(r,c - 1);
            const diagonal = sourceValue(r - 1,c - 1);
            els.observation.textContent = `计算 d[${r}][${c}]`;
            els.formulaLive.textContent = `${current} - ${up} - ${left} + ${diagonal} = ${signed(state.baseDiff[r][c])}`;
        } else if (state.builtCount === total) {
            els.observation.textContent = '四项容斥完成';
            els.formulaLive.textContent = '每个 d[i][j] 只记录这个位置发生的二维变化';
        } else {
            els.observation.textContent = '四项容斥';
            els.formulaLive.textContent = 'd[i][j] = 当前 - 上 - 左 + 左上';
        }
    } else if (state.phase === 'update') {
        const corners = cornerOperations(operation);
        els.observation.textContent = `矩形 ${operation.x2 - operation.x1 + 1}×${operation.y2 - operation.y1 + 1}`;
        if (state.updateApplied) {
            els.formulaLive.textContent = `只改 ${corners.length} 个有效角点，选区每格 ${signed(operation.delta)}`;
        } else if (state.activeCorner) {
            els.formulaLive.textContent = `d[${state.activeCorner.r}][${state.activeCorner.c}] ${state.activeCorner.delta >= 0 ? '+=' : '-='} ${Math.abs(state.activeCorner.delta)}`;
        } else {
            els.formulaLive.textContent = '左上 +Δ，右上 -Δ，左下 -Δ，右下 +Δ';
        }
    } else {
        if (state.restoreCurrent) {
            const r = state.restoreCurrent.r;
            const c = state.restoreCurrent.c;
            const d = state.workingDiff[r][c];
            const up = restoreValue(r - 1,c);
            const left = restoreValue(r,c - 1);
            const diagonal = restoreValue(r - 1,c - 1);
            els.observation.textContent = `还原 a[${r}][${c}]`;
            els.formulaLive.textContent = `${signed(d)} + ${up} + ${left} - ${diagonal} = ${state.restored[r][c]}`;
        } else if (state.restoreCount === total) {
            els.observation.textContent = '二维前缀还原完成';
            els.formulaLive.textContent = '还原矩阵与左侧更新后的原矩阵逐格一致';
        } else {
            els.observation.textContent = '上、左、左上';
            els.formulaLive.textContent = 'a[i][j] = d[i][j] + 上 + 左 - 左上';
        }
    }
}

function render() {
    renderSource();
    renderDiff();
    renderRestore();
    renderHeader();
}

function termSources(r,c) {
    const terms = [{r,c,sign:'+',value:state.base[r][c]}];
    if (r > 0) terms.push({r:r - 1,c,sign:'−',value:state.base[r - 1][c]});
    if (c > 0) terms.push({r,c:c - 1,sign:'−',value:state.base[r][c - 1]});
    if (r > 0 && c > 0) terms.push({r:r - 1,c:c - 1,sign:'+',value:state.base[r - 1][c - 1]});
    return terms;
}

async function animateTerms(r,c,token) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const target = els.diffGrid.querySelector(`.matrix-cell[data-r="${r}"][data-c="${c}"]`);
    if (!target) return;
    const targetRect = target.getBoundingClientRect();
    const animations = termSources(r,c).map((term,index) => {
        const source = els.sourceGrid.querySelector(`.matrix-cell[data-r="${term.r}"][data-c="${term.c}"]`);
        if (!source) return Promise.resolve();
        const from = source.getBoundingClientRect();
        const tokenEl = document.createElement('span');
        tokenEl.className = `flying-token${term.sign === '−' ? ' minus' : ''}`;
        tokenEl.textContent = `${term.sign}${term.value}`;
        tokenEl.style.left = `${from.left + from.width * .18}px`;
        tokenEl.style.top = `${from.top + from.height * .18}px`;
        tokenEl.style.width = `${from.width * .64}px`;
        tokenEl.style.height = `${from.height * .64}px`;
        document.body.appendChild(tokenEl);
        const targetX = targetRect.left + targetRect.width / 2 - (from.left + from.width / 2);
        const targetY = targetRect.top + targetRect.height / 2 - (from.top + from.height / 2);
        const animation = tokenEl.animate([
            {transform:'translate(0,0) scale(1)',opacity:.95},
            {transform:`translate(${targetX}px,${targetY}px) scale(.72)`,opacity:.76}
        ],{
            duration:duration(760),
            delay:duration(index * 90),
            easing:'cubic-bezier(.22,.76,.25,1)',
            fill:'forwards'
        });
        return animation.finished.catch(()=>{}).then(() => tokenEl.remove());
    });
    await Promise.all(animations);
    return token === state.token;
}

async function buildOne() {
    if (state.busy) return;
    const total = state.rows * state.cols;
    if (state.builtCount >= total) {
        state.builtCount = 0;
        state.compare = null;
        state.compareStage = 'idle';
    }
    state.busy = true;
    const token = ++state.token;
    const index = state.builtCount;
    const r = Math.floor(index / state.cols);
    const c = index % state.cols;
    state.compare = {r,c};
    state.compareStage = 'collect';
    render();
    await animateTerms(r,c,token);
    if (token !== state.token) return finishCancelled();
    state.compareStage = 'resolve';
    render();
    if (!await wait(520,token)) return finishCancelled();
    state.builtCount++;
    state.compare = null;
    state.compareStage = 'idle';
    state.busy = false;
    render();
}

async function playBuild() {
    if (state.busy) return;
    const total = state.rows * state.cols;
    if (state.builtCount >= total) {
        state.builtCount = 0;
        state.workingDiff = cloneMatrix(state.baseDiff);
        render();
    }
    while (state.builtCount < total && !state.busy) await buildOne();
}

function revealBuildImmediately() {
    state.builtCount = state.rows * state.cols;
    state.compare = null;
    state.compareStage = 'idle';
}

async function runUpdate() {
    if (state.busy) return;
    clearError();
    let operation;
    try {
        operation = readOperation();
    } catch (error) {
        showError(error.message);
        return;
    }
    revealBuildImmediately();
    state.phase = 'update';
    state.updateApplied = false;
    state.workingDiff = cloneMatrix(state.baseDiff);
    state.updated = cloneMatrix(state.base);
    state.appliedCornerCount = 0;
    state.activeCorner = null;
    state.restored = emptyMatrix(state.rows,state.cols,null);
    state.restoreCount = 0;
    state.restoreCurrent = null;
    state.busy = true;
    const token = ++state.token;
    const corners = cornerOperations(operation);
    render();

    for (let index = 0; index < corners.length; index++) {
        const corner = corners[index];
        state.activeCorner = corner;
        state.workingDiff[corner.r][corner.c] += corner.delta;
        state.appliedCornerCount = index + 1;
        render();
        if (!await wait(650,token)) return finishCancelled();
    }

    state.updated = operation.next;
    state.updateApplied = true;
    state.changeAnimating = true;
    render();
    await animateRegion(operation,token);
    if (token !== state.token) return finishCancelled();
    state.changeAnimating = false;
    state.activeCorner = null;
    state.busy = false;
    render();
}

async function animateRegion(operation,token) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const animations = [];
    for (let r = operation.x1; r <= operation.x2; r++) {
        for (let c = operation.y1; c <= operation.y2; c++) {
            const cell = els.sourceGrid.querySelector(`.matrix-cell[data-r="${r}"][data-c="${c}"]`);
            if (!cell) continue;
            const delay = ((r - operation.x1) + (c - operation.y1)) * 105;
            const animation = cell.animate([
                {transform:'translateY(0) scale(1)',backgroundColor:'var(--amber-soft)'},
                {transform:'translateY(-7px) scale(1.04)',backgroundColor:'var(--teal-soft)',offset:.58},
                {transform:'translateY(0) scale(1)',backgroundColor:'var(--surface)'}
            ],{
                duration:duration(940),
                delay:duration(delay),
                easing:'cubic-bezier(.2,.72,.2,1)'
            });
            animations.push(animation.finished.catch(()=>{}));
        }
    }
    await Promise.all(animations);
    return token === state.token;
}

function undoUpdate() {
    if (state.busy) return;
    state.token++;
    state.updateApplied = false;
    state.workingDiff = cloneMatrix(state.baseDiff);
    state.updated = cloneMatrix(state.base);
    state.appliedCornerCount = 0;
    state.activeCorner = null;
    state.restored = emptyMatrix(state.rows,state.cols,null);
    state.restoreCount = 0;
    state.restoreCurrent = null;
    render();
}

function prepareRestore(restart = false) {
    revealBuildImmediately();
    const total = state.rows * state.cols;
    if (restart || state.restoreCount >= total) {
        state.restored = emptyMatrix(state.rows,state.cols,null);
        state.restoreCount = 0;
        state.restoreCurrent = null;
    }
}

async function restoreOne() {
    if (state.busy) return;
    state.phase = 'restore';
    const total = state.rows * state.cols;
    prepareRestore(state.restoreCount >= total);
    state.busy = true;
    const token = ++state.token;
    const index = state.restoreCount;
    const r = Math.floor(index / state.cols);
    const c = index % state.cols;
    const up = restoreValue(r - 1,c);
    const left = restoreValue(r,c - 1);
    const diagonal = restoreValue(r - 1,c - 1);
    state.restored[r][c] = state.workingDiff[r][c] + up + left - diagonal;
    state.restoreCurrent = {r,c};
    state.restoreCount++;
    render();
    if (!await wait(560,token)) return finishCancelled();
    state.restoreCurrent = null;
    state.busy = false;
    render();
}

async function playRestore() {
    if (state.busy) return;
    state.phase = 'restore';
    const total = state.rows * state.cols;
    prepareRestore(state.restoreCount >= total);
    render();
    while (state.restoreCount < total && !state.busy) await restoreOne();
}

function switchPhase(phase) {
    if (state.busy) {
        state.token++;
        state.busy = false;
        state.compare = null;
        state.compareStage = 'idle';
        state.restoreCurrent = null;
    }
    state.phase = phase;
    if (phase !== 'build') revealBuildImmediately();
    render();
}

function finishCancelled() {
    state.busy = false;
    state.compare = null;
    state.compareStage = 'idle';
    state.restoreCurrent = null;
    render();
}

els.loadBtn.addEventListener('click',loadFromInput);
els.resetBtn.addEventListener('click',resetAll);
els.primaryBtn.addEventListener('click',() => {
    if (state.phase === 'build') playBuild();
    else if (state.phase === 'update') runUpdate();
    else playRestore();
});
els.secondaryBtn.addEventListener('click',() => {
    if (state.phase === 'build') buildOne();
    else if (state.phase === 'update') undoUpdate();
    else restoreOne();
});
document.querySelectorAll('.phase-tab').forEach(button => {
    button.addEventListener('click',() => switchPhase(button.dataset.phase));
});
[els.x1Input,els.y1Input,els.x2Input,els.y2Input,els.deltaInput].forEach(input => {
    input.addEventListener('change',() => {
        clearError();
        if (state.phase === 'update' && !state.updateApplied) render();
    });
});

resetAll();
</script>
</body>
</html>
