<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="信息学奥赛数论专题互动课件：整除、同余、质因数、gcd、筛法、欧拉函数、模逆元与CRT。">
  <title>数论专题</title>
  <style>
    :root {
      --header-h: 62px;
      --sidebar-w: 260px;
      --ink: #e0e0e0;
      --text: #d1d5db;
      --muted: #9ca3af;
      --line: #374151;
      --paper: #1f2937;
      --paper-soft: #111827;
      --teal: #14b8a6;
      --teal-soft: #0f766e;
      --blue: #3b82f6;
      --blue-soft: #1e40af;
      --amber: #f59e0b;
      --amber-soft: #d97706;
      --red: #ef4444;
      --red-soft: #dc2626;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      --glass-bg: rgba(31, 41, 55, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      line-height: 1.75;
      backdrop-filter: blur(10px);
    }
    .glass-effect {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }
    button, input, select { font: inherit; }
    button { letter-spacing: 0; }
    code, pre { font-family: Consolas, "Courier New", monospace; }
    code {
      padding: 0 2px;
      color: #24473f;
      background: transparent;
      border-radius: 0;
    }
    sup, sub { position: relative; line-height: 0; font-size: .68em; vertical-align: baseline; }
    sup { top: -.58em; }
    sub { bottom: -.18em; }
    h1, h2, h3, h4 { color: var(--ink); line-height: 1.35; letter-spacing: 0; }
    h1 { margin: 0 0 12px; font-size: 36px; }
    h2 { margin: 0 0 12px; font-size: 29px; }
    h3 { margin: 24px 0 10px; font-size: 20px; }
    h4 { margin: 10px 0 6px; font-size: 16px; }
    p { margin: 8px 0; }
    a { color: inherit; }
    .topbar {
      position: fixed;
      z-index: 40;
      inset: 0 0 auto;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      color: #fff;
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand strong { display: block; font-size: 18px; line-height: 1.2; }
    .brand small { display: block; color: #9ca3af; line-height: 1.2; }
    .menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      color: #d1d5db;
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 22px;
    }
    .top-meta { color: #9ca3af; font-size: 13px; }
    .sidebar {
      position: fixed;
      z-index: 35;
      top: var(--header-h);
      bottom: 0;
      left: 0;
      width: var(--sidebar-w);
      padding: 22px 14px 28px;
      overflow-y: auto;
      background: var(--glass-bg);
      border-right: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }
    .sidebar-title { margin: 0 10px 12px; color: var(--muted); font-size: 13px; font-weight: 800; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      color: var(--text);
      text-decoration: none;
      border-left: 3px solid transparent;
      font-size: 14px;
    }
    .nav-link:hover, .nav-link.active {
      color: #14b8a6;
      background: rgba(16, 185, 129, 0.2);
      border-left-color: #14b8a6;
      font-weight: 800;
    }
    .nav-num { color: #6b7280; font: 11px Consolas, monospace; }
    .overlay { display: none; }
    main { margin-left: var(--sidebar-w); padding-top: var(--header-h); }
    .chapter {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .chapter:nth-child(even) { background: var(--paper-soft); }
    .section-inner {
      width: min(1120px, calc(100% - 56px));
      margin: 0 auto;
      padding: 54px 0 62px;
      background: var(--glass-bg);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .chapter-kicker {
      margin-bottom: 8px;
      color: var(--teal);
      font: 800 13px Consolas, "Microsoft YaHei", sans-serif;
    }
    .lead { max-width: 940px; margin-bottom: 24px; color: #51645d; font-size: 17px; }
    .memory, .warning, .interactive-answer {
      margin: 16px 0;
      padding: 14px 16px;
      border-left: 4px solid var(--teal);
      background: rgba(16, 185, 129, 0.2);
      backdrop-filter: blur(10px);
    }
    .warning { border-left-color: var(--red); background: rgba(239, 68, 68, 0.2); }
    .interactive-answer { border-left-color: var(--amber); background: rgba(245, 158, 11, 0.2); }
    .interactive-answer strong { color: #d97706; margin-right: 8px; }
    .point-grid, .grid-2, .grid-3, .formula-row {
      display: grid;
      gap: 14px;
      margin: 16px 0;
    }
    .point-grid, .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .formula-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel, .point-card {
      min-width: 0;
      padding: 17px 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      backdrop-filter: blur(10px);
    }
    .point-card { border-top: 4px solid var(--teal); }
    .point-card:nth-child(2) { border-top-color: var(--blue); }
    .point-card:nth-child(3) { border-top-color: var(--amber); }
    .point-card h3, .panel h3 { margin-top: 0; }
    .formula {
      min-height: 104px;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }
    .formula strong { color: #d1d5db; font: 800 20px Georgia, "Times New Roman", serif; }
    .formula span { display: block; color: var(--muted); font-size: 13px; }
    .formula .math-product { display: inline-flex; flex-wrap: nowrap; gap: 5px; color: #d1d5db; font-size: 18px; white-space: nowrap; }
    .formula .math-product > span { display: inline-flex; width: auto; color: #d1d5db; font-size: inherit; }
    .interactive-lab {
      margin: 24px 0;
      padding: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-title h3 { margin: 0; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 8px;
      color: #155e56;
      background: #e5f2ef;
      border: 1px solid #b9d8d1;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 800;
    }
    .tag.blue { color: #245889; background: var(--blue-soft); border-color: #bed4ea; }
    .tag.amber { color: #7a4700; background: var(--amber-soft); border-color: #ead09a; }
    .controls {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }
    .controls label { color: #40534d; font-size: 14px; font-weight: 700; }
    .control-input, .control-select {
      width: 94px;
      min-height: 40px;
      padding: 7px 9px;
      color: #203a34;
      background: #fff;
      border: 1px solid #aebfba;
      border-radius: 4px;
    }
    .control-select { width: 154px; }
    .btn, .seg-btn {
      min-height: 40px;
      padding: 8px 13px;
      color: #fff;
      background: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 800;
    }
    .btn:hover, .seg-btn:hover { filter: brightness(.95); }
    .btn.secondary, .seg-btn { color: #27564e; background: #fff; border-color: #9db4ae; }
    .seg-btn.active { color: #fff; background: var(--blue); border-color: var(--blue); }
    .stage {
      min-height: 150px;
      padding: 16px;
      overflow-x: auto;
      background: #f7faf9;
      border: 1px dashed #9db6af;
    }
    .congruence-board {
      display: grid;
      gap: 8px;
      min-width: 760px;
    }
    .mod-compare-head, .mod-compare-row {
      display: grid;
      grid-template-columns: 92px repeat(var(--q-cols), minmax(82px, 1fr)) minmax(118px, 1fr);
      align-items: center;
      gap: 5px;
    }
    .mod-compare-head { color: #50655f; font-size: 12px; font-weight: 800; }
    .mod-compare-head > span { padding: 3px 5px; text-align: center; }
    .mod-compare-row {
      min-height: 68px;
      padding: 8px;
      background: #fff;
      border: 1px solid #d3dfdb;
    }
    .mod-compare-row.same-class { box-shadow: inset 4px 0 0 var(--teal); }
    .mod-row-label { text-align: center; }
    .mod-row-label strong { display: block; color: #173f37; font-size: 17px; }
    .mod-row-label small { color: var(--muted); }
    .mod-cell {
      position: relative;
      min-height: 48px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px solid #fff;
      font-weight: 800;
    }
    .mod-cell.full {
      color: #fff;
      background: var(--blue);
      border-color: #1f5d94;
    }
    .mod-cell.ghost {
      color: #7b8e88;
      background: repeating-linear-gradient(135deg, #fff 0 7px, #f2f6f5 7px 14px);
      border: 2px dashed #9dafaa;
    }
    .mod-cell.remainder-cell {
      justify-items: start;
      background: #f6f9f8;
      border: 2px dashed #9dafaa;
    }
    .remainder-fill {
      height: 100%;
      min-width: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      white-space: nowrap;
      transition: width .25s ease;
    }
    .remainder-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #173f37;
      text-shadow: 0 1px #fff;
      font-size: 12px;
      font-weight: 900;
    }
    .mod-compare-note { padding: 10px 12px; background: #edf5f2; border-left: 4px solid var(--teal); }
    .legend-row { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 2px; font-size: 13px; }
    .legend-dot { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; border-radius: 50%; }
    .factor-tree-wrap { min-width: 700px; }
    .factor-tree-svg { display: block; width: 100%; height: auto; }
    .factor-progress {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    .factor-progress-track { height: 12px; overflow: hidden; background: #e2ebe8; border: 1px solid #bdd0ca; }
    .factor-progress-fill { height: 100%; background: var(--teal); transition: width .2s ease; }
    .division-board { min-width: 690px; }
    .division-equation {
      padding: 14px;
      color: #173c35;
      text-align: center;
      background: #fff;
      border: 1px solid #bdcdc8;
      font: 800 24px Georgia, "Times New Roman", serif;
    }
    .division-strip {
      display: flex;
      align-items: stretch;
      min-height: 72px;
      margin: 14px 0;
      border: 1px solid #9fb5ae;
      background: #fff;
    }
    .division-piece {
      display: grid;
      place-items: center;
      min-width: 55px;
      padding: 8px;
      color: #fff;
      background: var(--blue);
      border-right: 2px solid #fff;
      font-weight: 800;
    }
    .division-piece.remainder { color: #714100; background: #ffdc88; }
    .beaker-row {
      display: grid;
      grid-template-columns: 1fr 70px 1fr 70px 1fr;
      align-items: end;
      gap: 14px;
      min-width: 720px;
      padding: 12px 18px;
    }
    .beaker-card { text-align: center; }
    .beaker {
      position: relative;
      width: 130px;
      height: 190px;
      margin: 0 auto 10px;
      overflow: hidden;
      background:
        repeating-linear-gradient(to top, transparent 0 27px, #cbd8d3 28px, transparent 29px),
        #fff;
      border: 4px solid #6f8981;
      border-top: 0;
      border-radius: 0 0 16px 16px;
    }
    .beaker::before, .beaker::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      width: 25px;
      height: 4px;
      background: #6f8981;
    }
    .beaker::before { left: -4px; }
    .beaker::after { right: -4px; }
    .beaker-liquid {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 8px;
      background: rgba(40, 103, 168, .78);
      transition: height .25s ease;
    }
    .beaker-liquid.negative { background: rgba(180, 60, 50, .72); }
    .beaker-liquid.result { background: rgba(15, 118, 110, .8); }
    .beaker-value { font: 800 16px Consolas, monospace; }
    .beaker-op { align-self: center; color: var(--amber); text-align: center; font-size: 34px; font-weight: 900; }
    .substitution-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .power-machine {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) 120px minmax(230px, 1fr);
      align-items: center;
      gap: 18px;
      min-width: 700px;
      padding: 12px 4px 18px;
    }
    .power-side {
      min-height: 160px;
      display: grid;
      align-content: end;
      justify-items: center;
      padding: 14px;
      background: #fff;
      border: 1px solid #c4d1cd;
    }
    .power-bar {
      width: 68%;
      min-width: 62px;
      display: grid;
      place-items: center;
      padding: 9px;
      color: #fff;
      background: var(--blue);
      transition: width .25s ease, height .25s ease;
      font-weight: 800;
    }
    .power-bar.shrink { background: var(--amber); }
    .power-math {
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      line-height: 1;
    }
    .power-base-symbol { font: 900 30px Georgia, serif; }
    .power-exp-symbol { margin-top: -2px; padding: 2px 4px; background: #ffffff26; font: 800 16px Consolas, monospace; }
    .power-exp-symbol sup { position: static; margin-left: 2px; font-size: 11px; vertical-align: super; }
    .power-mod-line { display: block; margin-top: 8px; font-size: 15px; }
    .power-center { text-align: center; }
    .power-bit {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 8px;
      color: #fff;
      background: var(--teal);
      border-radius: 50%;
      font: 900 28px Consolas, monospace;
    }
    .prime-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .prime-summary > div { padding: 10px; text-align: center; background: #fff; border: 1px solid var(--line); }
    .prime-boundary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .prime-boundary > div { padding: 10px; text-align: center; background: #fff; border: 1px solid var(--line); }
    .trial-ruler { display: flex; align-items: end; gap: 5px; min-width: 560px; margin: 12px 0; }
    .trial-mark {
      min-width: 42px;
      min-height: 50px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid #aabbb6;
      font-weight: 800;
    }
    .trial-mark.tested { color: #fff; background: var(--blue); border-color: var(--blue); }
    .trial-mark.factor { color: #fff; background: var(--amber); border-color: var(--amber); }
    .trial-mark.boundary { border-style: dashed; border-width: 2px; }
    .trial-list { display: grid; gap: 6px; margin-top: 10px; }
    .trial-row {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) 110px;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .trial-row strong { font-family: Consolas, monospace; }
    .trial-result { padding: 4px 7px; text-align: center; white-space: nowrap; color: #27564e; background: #edf5f2; }
    .trial-row.factor-row { border-color: var(--amber); background: #fff8e5; }
    .trial-row.factor-row .trial-result { color: #fff; background: var(--amber); }
    .status { min-height: 30px; margin-top: 10px; color: var(--muted); font-size: 14px; }
    .segment-row, .chip-row, .bit-row, .sequence-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 52px;
    }
    .segment {
      min-width: 66px;
      min-height: 54px;
      display: grid;
      place-items: center;
      padding: 7px;
      color: #fff;
      background: var(--teal);
      border: 2px solid #0b625b;
      font-weight: 800;
    }
    .segment.remainder { color: #744414; background: #ffdf92; border-color: var(--amber); }
    .chip, .factor-chip, .bit-chip, .number-cell {
      display: inline-grid;
      place-items: center;
      min-width: 42px;
      min-height: 38px;
      padding: 5px 8px;
      background: #fff;
      border: 1px solid #9eb4ae;
      border-radius: 3px;
      font-weight: 800;
    }
    .chip.active, .number-cell.active { color: #fff; background: var(--teal); border-color: var(--teal); }
    .bit-chip.active { color: #fff; background: var(--teal); border-color: var(--teal); }
    .bit-chip small { display: block; font-size: 10px; }
    .chip.blue { color: #1f5d94; background: var(--blue-soft); border-color: #91b7dc; }
    .chip.amber { color: #7a4700; background: var(--amber-soft); border-color: #d9ac5e; }
    .chip.crossed, .number-cell.crossed {
      color: #8e514b;
      background: #f7e7e5;
      border-color: #d9aaa5;
      text-decoration: line-through;
    }
    .factor-expression { font: 800 22px Georgia, serif; text-align: center; margin: 12px 0; }
    .math-product { display: inline-flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .math-power { display: inline-flex; align-items: flex-start; gap: 3px; white-space: nowrap; }
    .math-power sup { position: static; margin-top: -3px; font-size: .66em; line-height: 1; }
    .exponent-board { display: flex; align-items: end; justify-content: center; gap: 24px; min-height: 150px; }
    .prime-column { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
    .prime-column i { width: 48px; height: 22px; display: grid; place-items: center; color: #fff; background: var(--blue); font-style: normal; }
    .prime-column b { margin-top: 6px; }
    .number-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(44px, 1fr));
      gap: 6px;
      min-width: 560px;
    }
    button.number-cell { cursor: pointer; }
    .number-cell.prime { color: #fff; background: var(--teal); border-color: var(--teal); text-decoration: none; }
    .number-cell.current { color: #704000; background: #ffda78; border: 2px solid var(--amber); text-decoration: none; }
    .number-cell small { display: block; font-size: 10px; font-weight: 600; }
    .step-table, .table-wrap { margin: 16px 0; overflow-x: auto; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: #26443d; background: #edf3f1; font-size: 13px; }
    .step-table table { min-width: 560px; }
    .visual-svg { display: block; width: 100%; min-width: 620px; height: auto; }
    .code-block {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 16px 0;
      padding: 16px;
      overflow-x: auto;
      color: #d1d5db;
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid var(--glass-border);
      border-left: 4px solid #14b8a6;
      border-radius: 4px;
      font: 13px/1.65 Consolas, "Courier New", monospace;
      backdrop-filter: blur(10px);
    }
    .code-block code { padding: 0; color: inherit; background: transparent; }
    .exercise-set {
      position: relative;
      margin-top: 28px;
      padding: 18px 20px 62px;
      background: #fffdf5;
      border: 1px solid #e8d7a5;
      border-left: 4px solid var(--amber);
    }
    .exercise-set h3 { margin-top: 0; color: #79500e; }
    .exercise-set ol { margin-bottom: 0; }
    .exercise-set sup { margin-left: 2px; }
    .blank { display: inline-block; min-width: 72px; height: 1.2em; vertical-align: bottom; border-bottom: 1px solid #50615b; }
    .answer-link {
      position: absolute;
      right: 18px;
      bottom: 14px;
      padding: 6px 11px;
      color: #754d11;
      background: #fff;
      border: 1px solid #c9b78c;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) { const r = a % b; a = b; b = r; }
      return a;
    }
    function exgcd(a, b) {
      if (b === 0) return { g: Math.abs(a), x: a >= 0 ? 1 : -1, y: 0 };
      const next = exgcd(b, a % b);
      return { g: next.g, x: next.y, y: next.x - Math.trunc(a / b) * next.y };
    }
    function norm(a, m) { return ((a % m) + m) % m; }
    function lcm(a, b) { return Math.abs(a / gcd(a, b) * b); }
    function clampInt(value, low, high) {
      const number = Number(value);
      if (!Number.isInteger(number)) return low;
      return Math.max(low, Math.min(high, number));
    }
    function factorize(n) {
      const factors = [];
      for (let p = 2; p * p <= n; p++) {
        if (n % p) continue;
        let e = 0;
        while (n % p === 0) { n /= p; e++; }
        factors.push([p, e]);
      }
      if (n > 1) factors.push([n, 1]);
      return factors;
    }
    function isPrime(n) {
      if (n < 2) return false;
      for (let p = 2; p * p <= n; p++) if (n % p === 0) return false;
      return true;
    }
    function phiValue(n) {
      let ans = n, x = n;
      for (let p = 2; p * p <= x; p++) {
        if (x % p) continue;
        ans = ans / p * (p - 1);
        while (x % p === 0) x /= p;
      }
      if (x > 1) ans = ans / x * (x - 1);
      return ans;
    }
    function setResult(statusId, answerId, text) {
      $(statusId).innerHTML = text;
      $(answerId).innerHTML = `<strong>当前答案</strong>${text}`;
    }

    // 01 congruence segment comparison
    function renderRemainder() {
      let values = $('#remValues').value.split(/[,，\s]+/).filter(Boolean).map(Number).filter(Number.isFinite).map(x => clampInt(Math.trunc(x), 0, 100)).slice(0, 4);
      if (values.length < 2) values = [5, 17];
      const m = clampInt($('#remM').value, 2, 12);
      $('#remValues').value = values.join(','); $('#remM').value = m;
      const rows = values.map((value, index) => ({value, index, q: Math.floor(value / m), r: norm(value, m)}));
      const maxQ = Math.max(1, ...rows.map(row => row.q));
      const residueCount = rows.reduce((map, row) => map.set(row.r, (map.get(row.r) || 0) + 1), new Map());
      const colors = ['#b66b00', '#0f766e', '#8b5aa5', '#b24f45', '#5678aa', '#77712c'];
      const residueColors = new Map([...residueCount.keys()].map((r, i) => [r, colors[i % colors.length]]));
      const head = `<div class="mod-compare-head" style="--q-cols:${maxQ}"><span>整数分解</span>${Array.from({length:maxQ}, (_, i) => `<span>完整模段 ${maxQ-i}</span>`).join('')}<span>共同余数段</span></div>`;
      const body = rows.map(row => {
        const ghosts = Array.from({length:maxQ-row.q}, () => `<div class="mod-cell ghost">虚线对位</div>`).join('');
        const full = Array.from({length:row.q}, () => `<div class="mod-cell full">m=${m}</div>`).join('');
        const color = residueColors.get(row.r), width = row.r === 0 ? 3 : Math.max(10, row.r / m * 100);
        const remainder = `<div class="mod-cell remainder-cell"><span class="remainder-fill" style="width:${width}%;background:${color}"></span><span class="remainder-label">余 ${row.r}</span></div>`;
        return `<div class="mod-compare-row${residueCount.get(row.r)>1?' same-class':''}" style="--q-cols:${maxQ}"><div class="mod-row-label"><strong>${row.value}</strong><small>${row.q}×${m}+${row.r}</small></div>${ghosts}${full}${remainder}</div>`;
      }).join('');
      const groups = [...residueCount.entries()].map(([r, count]) => `余 ${r}：${count} 条`).join('；');
      $('#remLines').innerHTML = `${head}${body}<div class="mod-compare-note">右端余数段对齐；左侧每多一个蓝块，原数就多 ${m}。虚线格专门用来比较“相差了几个完整模数”。</div>`;
      const equations = rows.map(row => `${row.value}=${row.q}×${m}+${row.r}`).join('；');
      const allSame = residueCount.size === 1;
      setResult('#remStatus', '#remAnswer', `${equations}。${groups}。${allSame ? `所有余数段完全相同，任意两数之差都由若干个完整的 ${m} 组成，因此两两同余。` : '余数段颜色或长度不同的两行不同余；只有余数相同的行互相同余。'}`);
    }
    $('#remBuild').addEventListener('click', renderRemainder);
    renderRemainder();

    // 02 interactive factor tree
    let factorOriginal=360,factorRemain=360,factorSteps=[],factorFound=[],factorDone=false;
    function buildFactor() {
      factorOriginal=clampInt($('#factorN').value,2,1000000);
      $('#factorN').value=factorOriginal;
      factorRemain=factorOriginal;factorSteps=[];factorFound=[];factorDone=false;
      $('#factorPick').value=2;
      renderFactor('从候选因子 2 开始。先判断它是否为质数，再检查能否整除当前节点。');
    }
    function factorTreeData(){
      function build(value,index){
        if(index>=factorSteps.length)return {value,prime:factorDone&&isPrime(value)};
        const step=factorSteps[index];
        return {value,children:[{value:step.p,prime:true},build(step.q,index+1)]};
      }
      return build(factorOriginal,0);
    }
    function renderFactor(message=''){
      const tree=factorTreeData();
      function countLeaves(node){return node.children?node.children.reduce((s,x)=>s+countLeaves(x),0):1;}
      function depth(node){return node.children?1+Math.max(...node.children.map(depth)):0;}
      const leaves=countLeaves(tree),maxDepth=depth(tree),width=760,height=Math.max(180,90*(maxDepth+1)+35),unit=(width-80)/Math.max(leaves,2);
      const nodes=[],lines=[];
      function place(node,start,d,parent){
        const leafCount=countLeaves(node),x=40+(start+leafCount/2)*unit,y=36+d*86;
        nodes.push({node,x,y});
        if(parent)lines.push([parent.x,parent.y+18,x,y-18]);
        if(node.children){let cursor=start;node.children.forEach(child=>{const childLeaves=countLeaves(child);place(child,cursor,d+1,{x,y});cursor+=childLeaves;});}
      }
      place(tree,0,0,null);
      let svg=`<svg class="factor-tree-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="逐步因数树">`;
      lines.forEach(([x1,y1,x2,y2])=>svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#78918a" stroke-width="3"/>`);
      nodes.forEach(({node,x,y})=>{
        const prime=node.prime||(!node.children&&isPrime(node.value)&&factorDone),fill=prime?'#0f766e':node.children?'#2867a8':'#ffdf92',text=prime||node.children?'#fff':'#714100';
        svg+=`<circle cx="${x}" cy="${y}" r="24" fill="${fill}" stroke="${prime?'#075e57':'#78918a'}" stroke-width="2"/><text x="${x}" y="${y+6}" text-anchor="middle" fill="${text}" font-size="15" font-weight="800">${node.value}</text>`;
      });
      svg+='</svg>';
      $('#factorTree').innerHTML=svg;
      const summary=factorFound.length?`<span class="math-product">${factorize(factorOriginal).map(([p,e])=>`<span class="math-power">${p}<sup>${e}</sup></span>`).join('<span>×</span>')}</span>`:'等待填写';
      $('#factorExpression').innerHTML=factorDone?`${factorOriginal} = ${summary}`:`已取出：${factorFound.join(' × ')||'尚未取出质因子'}；当前剩余 ${factorRemain}`;
      const total=factorize(factorOriginal).reduce((s,[,e])=>s+e,0);
      $('#factorProgress').style.width=`${Math.min(100,factorFound.length/total*100)}%`;
      $('#factorRemain').textContent=factorDone?'分解完成':`待分解：${factorRemain}`;
      const prompt=factorDone?`${factorOriginal} 的质因数已经全部落在叶子节点：${summary}。`:message||`当前节点是 ${factorRemain}，请从候选 ${$('#factorPick').value} 继续尝试。`;
      setResult('#factorStatus','#factorAnswer',prompt);
    }
    function tryFactor(){
      if(factorDone)return renderFactor('因数树已经完成，可修改 n 后重建。');
      const p=clampInt($('#factorPick').value,2,1000000);$('#factorPick').value=p;
      if(!isPrime(p))return renderFactor(`${p} 不是质数，不能直接写到质因数叶子上。`);
      if(factorRemain%p!==0)return renderFactor(`${p} 不能整除当前节点 ${factorRemain}，余数为 ${factorRemain%p}。请换下一个候选。`);
      factorFound.push(p);
      if(p===factorRemain){factorRemain=1;factorDone=true;return renderFactor('最后一个剩余节点本身是质数，因数树完成。');}
      const q=factorRemain/p;
      factorSteps.push({value:factorRemain,p,q});
      factorRemain=q;
      renderFactor(`${p} 可以整除，已把节点拆成 ${p}×${q}。若 ${q} 仍能被 ${p} 整除，可以继续填写同一个质因子。`);
    }
    $('#factorBuild').addEventListener('click',buildFactor);
    $('#factorTry').addEventListener('click',tryFactor);
    $('#factorNext').addEventListener('click',()=>{$('#factorPick').value=clampInt($('#factorPick').value,2,999999)+1;renderFactor(`候选已移动到 ${$('#factorPick').value}，请判断它是不是质因子。`);});
    buildFactor();

    // 03 Euclidean division diagram
    let gcdSteps = [], gcdIndex = 0, gcdInputs = [252, 105];
    function buildGcd() {
      let a = clampInt($('#gcdA').value, 1, 10000), b = clampInt($('#gcdB').value, 1, 10000);
      $('#gcdA').value = a; $('#gcdB').value = b;
      if(a<b)[a,b]=[b,a];

      gcdIndex = 0; renderGcd();
    }
    function renderGcd() {
      const shown = gcdSteps.slice(0, gcdIndex);
      const current=gcdSteps[Math.min(gcdIndex,gcdSteps.length-1)];
      const pieces=current?Array.from({length:Math.min(current.q,8)},()=>`<div class="division-piece" style="flex:1">${current.b}</div>`).join(''):'';
      const more=current&&current.q>8?`<div class="division-piece" style="flex:.8">…×${current.q}</div>`:'';
      const remainder=current&&current.r?`<div class="division-piece remainder" style="flex:${Math.max(.35,current.r/current.b)}">${current.r}</div>`:'';
      const rows = shown.map((s,i)=>`<tr><td>${i+1}</td><td>${s.a}=${s.b}×${s.q}+${s.r}</td><td>gcd(${s.b},${s.r})</td></tr>`).join('');
      $('#gcdStage').innerHTML = current?`<div class="division-equation">${current.a} = ${current.b} × ${current.q} + ${current.r}</div><div class="division-strip">${pieces}${more}${remainder||'<div class="division-piece remainder" style="flex:.3">余数 0</div>'}</div><div class="flow-line"><div class="flow-node">gcd(${gcdInputs[0]},${gcdInputs[1]})</div>${shown.map(s=>`<span class="flow-arrow">→</span><div class="flow-node">gcd(${s.b},${s.r})</div>`).join('')}</div><div class="step-table"><table><thead><tr><th>步</th><th>辗转相除式</th><th>下一组</th></tr></thead><tbody>${rows||'<tr><td colspan="3">点击“下一步”，余数将成为下一轮除数</td></tr>'}</tbody></table></div>`:'';
      const done = gcdIndex === gcdSteps.length;
      const g=gcd(gcdInputs[0],gcdInputs[1]);
      setResult('#gcdStatus','#gcdAnswer',done?`余数变为 0，最后一个非零余数是 ${g}，所以 gcd(${gcdInputs[0]},${gcdInputs[1]})=${g}。`:`已完成 ${gcdIndex}/${gcdSteps.length} 轮。蓝色整段表示 ${current.b}，黄色表示余数 ${current.r}；下一轮只保留“除数与余数”。`);
    }
    $('#gcdBuild').addEventListener('click',buildGcd);
    $('#gcdNext').addEventListener('click',()=>{gcdIndex=Math.min(gcdSteps.length,gcdIndex+1);renderGcd();});
    $('#gcdPrev').addEventListener('click',()=>{gcdIndex=Math.max(0,gcdIndex-1);renderGcd();});
    buildGcd();

    // 04 Bezout measuring cups
    function renderBezout(){
      let a=clampInt($('#bezA').value,1,10000),b=clampInt($('#bezB').value,1,10000);
      $('#bezA').value=a;$('#bezB').value=b;
      const eg=exgcd(a,b),ca=a*eg.x,cb=b*eg.y,max=Math.max(Math.abs(ca),Math.abs(cb),eg.g),scale=value=>Math.max(8,Math.round(Math.abs(value)/max*175));

      setResult('#bezStatus','#bezAnswer',`蓝色量杯表示正贡献，红色量杯表示负贡献。${ca>=0?ca:`(${ca})`}+${cb>=0?cb:`(${cb})`}=${eg.g}，因此一组贝祖系数是 x=${eg.x}、y=${eg.y}。`);

    // 05 Diophantine lattice
    function renderDio() {
      const a=clampInt($('#dioA').value,1,12), b=clampInt($('#dioB').value,1,12), c=clampInt($('#dioC').value,1,120);
      $('#dioA').value=a; $('#dioB').value=b; $('#dioC').value=c;
      const g=gcd(a,b), has=c%g===0, max=12, ox=65, oy=355, sx=52, sy=25;

    // 05 modular clock
    function renderMod() {

    $('#invBuild').addEventListener('click',renderInverse);renderInverse();

    // 15 Wilson pairing
    function renderWilson(){const p=clampInt($('#wilsonP').value,2,23);$('#wilsonP').value=p;const used=new Set(),pairs=[];for(let x=1;x<p;x++){if(used.has(x))continue;let inv=-1;for(let y=1;y<p;y++)if(x*y%p===1){inv=y;break;}used.add(x);if(inv>=0)used.add(inv);pairs.push([x,inv]);}$('#wilsonPairs').innerHTML=pairs.map(([x,y])=>`<div class="pair-card"><strong>${y<0?`${x} 无逆元`:x===y?`${x} 自逆`:`${x} ↔ ${y}`}</strong><br>${y<0?'不能配成积 1':'积 ≡ 1'}</div>`).join('');let f=1;for(let i=1;i<p;i++)f=f*i%p;setResult('#wilsonStatus','#wilsonAnswer',`${p}${isPrime(p)?' 是质数':' 不是质数'}；(${p}−1)! mod ${p}=${f}，而 −1 的标准余数是 ${p-1}。${f===p-1?'满足':'不满足'}威尔逊条件。`);}
    $('#wilsonBuild').addEventListener('click',renderWilson);renderWilson();

    // 16 CRT construction and overlap verification
    function inverseNumber(a,m){const result=exgcd(a,m);return result.g===1?norm(result.x,m):-1;}
    function renderCrt(){
      const r1Raw=clampInt($('#crtR1').value,0,30),m1=clampInt($('#crtM1').value,2,20),r2Raw=clampInt($('#crtR2').value,0,30),m2=clampInt($('#crtM2').value,2,20),r1=norm(r1Raw,m1),r2=norm(r2Raw,m2),g=gcd(m1,m2),period=lcm(m1,m2),limit=period*2;
      $('#crtR1').value=r1Raw;$('#crtM1').value=m1;$('#crtR2').value=r2Raw;$('#crtM2').value=m2;
      const a=[],b=[],both=[];for(let x=0;x<=limit;x++){if(x%m1===r1)a.push(x);if(x%m2===r2)b.push(x);if(x%m1===r1&&x%m2===r2)both.push(x);}
      const compatible=(r2-r1)%g===0;
      if(g===1){
        const M=m1*m2,M1=M/m1,M2=M/m2,t1=inverseNumber(M1,m1),t2=inverseNumber(M2,m2),part1=r1*M1*t1,part2=r2*M2*t2,x0=norm(part1+part2,M);
        $('#crtFormula').innerHTML=`<div class="crt-step-grid"><div class="crt-step-card"><strong>1. 总模数 M</strong>M=${m1}×${m2}=${M}</div><div class="crt-step-card"><strong>2. 缺一模数 Mᵢ</strong>M₁=${M1}，M₂=${M2}</div><div class="crt-step-card"><strong>3. 校正系数 tᵢ</strong>t₁=${t1}，t₂=${t2}</div><div class="crt-step-card"><strong>4. 合并并取模</strong>x₀=(${part1}+${part2}) mod ${M}=${x0}</div></div>`;
        $('#crtBlocks').innerHTML=`<div class="crt-block-grid"><div class="crt-block-card"><strong>r₁M₁t₁=${r1}×${M1}×${t1}=${part1}</strong><div class="crt-checks"><span>mod ${m1} → ${norm(part1,m1)}=r₁</span><span>mod ${m2} → ${norm(part1,m2)}=0</span></div></div><div class="crt-plus">+</div><div class="crt-block-card amber"><strong>r₂M₂t₂=${r2}×${M2}×${t2}=${part2}</strong><div class="crt-checks"><span>mod ${m1} → ${norm(part2,m1)}=0</span><span>mod ${m2} → ${norm(part2,m2)}=r₂</span></div></div></div><div class="crt-final">x=(${part1}+${part2}) mod ${M}=${x0}，所以 x≡${x0} (mod ${M})</div>`;
      }else{
        $('#crtFormula').innerHTML=`<div class="crt-step-grid"><div class="crt-step-card"><strong>标准 CRT 前提</strong>gcd(${m1},${m2})=${g}≠1</div><div class="crt-step-card"><strong>兼容性检查</strong>${g}|(${r2}−${r1})：${compatible?'成立':'不成立'}</div><div class="crt-step-card"><strong>本节结论</strong>${compatible?'转入广义 CRT 合并':'两式冲突，无解'}</div><div class="crt-step-card"><strong>合并周期</strong>${compatible?period:'不存在'}</div></div>`;
        $('#crtBlocks').innerHTML=`<div class="crt-final">Mᵢ、tᵢ 的标准构造要求模数互质；当前数据请看下一节“广义 CRT”的消元过程。</div>`;
      }
      $('#crtRows').innerHTML=`<h4>结果核验：x≡${r1} (mod ${m1})</h4><div class="sequence-row">${a.map(x=>`<span class="chip${both.includes(x)?' active':' blue'}">${x}</span>`).join('')}</div><h4>x≡${r2} (mod ${m2})</h4><div class="sequence-row">${b.map(x=>`<span class="chip${both.includes(x)?' active':' amber'}">${x}</span>`).join('')}</div>`;
      setResult('#crtStatus','#crtAnswer',compatible?`构造结果与周期核验一致：最小非负解为 ${both[0]}，之后每隔 ${period} 重复。`:`gcd(${m1},${m2})=${g} 不能整除差值 ${r2-r1}，两条同余式无公共解。`);
    }
    $('#crtBuild').addEventListener('click',renderCrt);renderCrt();

    // 17 linear congruence
    function renderLinearCongruence(){const a=clampInt($('#lcA').value,1,50),b=clampInt($('#lcB').value,0,50),m=clampInt($('#lcM').value,2,30);$('#lcA').value=a;$('#lcB').value=b;$('#lcM').value=m;const solutions=Array.from({length:m},(_,x)=>x).filter(x=>a*x%m===b%m),g=gcd(a,m);$('#lcGrid').innerHTML=Array.from({length:m},(_,x)=>`<span class="chip${solutions.includes(x)?' active':''}">${x}</span>`).join('');$('#lcFlow').innerHTML=`<div class="flow-node">gcd(${a},${m})=${g}</div><span class="flow-arrow">→</span><div class="flow-node">${g}|${b} ? ${b%g===0?'是':'否'}</div><span class="flow-arrow">→</span><div class="flow-node">${solutions.length} 个解</div>`;setResult('#lcStatus','#lcAnswer',solutions.length?`模 ${m} 下全部解为 [${solutions.join(', ')}]，数量正好是 gcd(${a},${m})=${g}。`:`因为 ${g} 不能整除 ${b}，所以无解。`);}
    $('#lcBuild').addEventListener('click',renderLinearCongruence);renderLinearCongruence();

    function renderGeneralCrt(){
      const r1=Math.trunc(Number($('#gcrtR1').value)||0),m1=clampInt($('#gcrtM1').value,2,1000),r2=Math.trunc(Number($('#gcrtR2').value)||0),m2=clampInt($('#gcrtM2').value,2,1000),g=gcd(m1,m2),delta=r2-r1;
      $('#gcrtR1').value=r1;$('#gcrtM1').value=m1;$('#gcrtR2').value=r2;$('#gcrtM2').value=m2;
      if(delta%g!==0){$('#gcrtSteps').innerHTML=`<div class="crt-step-grid"><div class="crt-step-card"><strong>1. 求公因数</strong>g=gcd(${m1},${m2})=${g}</div><div class="crt-step-card"><strong>2. 求余数差</strong>Δ=${r2}−${r1}=${delta}</div><div class="crt-step-card"><strong>3. 检查整除</strong>${g}∤${delta}</div><div class="crt-step-card"><strong>4. 结论</strong>两式冲突，无解</div></div>`;$('#gcrtNote').innerHTML='模数共享的公因数要求两条余数在这个公因数下也一致；当前不一致，所以无法合并。';return;}
      const a=m1/g,b=delta/g,mod=m2/g,inv=inverseNumber(norm(a,mod),mod),k=norm(b*inv,mod),period=lcm(m1,m2),x0=norm(r1+m1*k,period);
      $('#gcrtSteps').innerHTML=`<div class="crt-step-grid"><div class="crt-step-card"><strong>1. 消去 r₁</strong>令 x=${r1}+${m1}k</div><div class="crt-step-card"><strong>2. 代入第二式</strong>${m1}k≡${delta} (mod ${m2})</div><div class="crt-step-card"><strong>3. 同除以 g=${g}</strong>${a}k≡${b} (mod ${mod})，k≡${k}</div><div class="crt-step-card"><strong>4. 回代</strong>x₀=${r1}+${m1}×${k}≡${x0} (mod ${period})</div></div><div class="crt-final">核验：${x0} mod ${m1}=${norm(x0,m1)}，${x0} mod ${m2}=${norm(x0,m2)}</div>`;
      $('#gcrtNote').innerHTML=`有解条件 ${g}|${delta} 成立。合并后的周期是 lcm(${m1},${m2})=${period}，所有解为 x=${x0}+${period}t。`;
    }
    $('#gcrtBuild').addEventListener('click',renderGeneralCrt);renderGeneralCrt();

    // 18 model selector
    const modelData={
      'single-prime':['试除到 √n','单次输入，没有固定批量上界','边界 n<2；循环条件 i*i≤n'],
      'many-prime':['埃筛 / 线性筛','询问多且共享上界','埃筛判质；线性筛还需要 lp 与积性函数'],
      'factor-many':['线性筛 lp','大量整数都不超过同一 N','沿 x←x/lp[x] 分解，每次除去一个最小质因子'],
      equation:['gcd + 扩展欧几里得','出现 ax+by=c 或 ax≡b','先判 gcd 是否整除，再求特解与通解'],
      power:['模快速幂 + 周期定理','指数很大且只需模意义答案','先检查互质/质数模条件，避免错误降幂'],
      cycles:['CRT / 广义 CRT','多个“除以 m 余 r”的周期条件','逐式合并；非互质时先检查余数差冲突']
    };
    let modelType='single-prime';
    function renderModel(){const [method,reason,check]=modelData[modelType];$('#modelFlow').innerHTML=`<div class="flow-node">识别题目语言</div><span class="flow-arrow">→</span><div class="flow-node">${method}</div><span class="flow-arrow">→</span><div class="flow-node">检查条件与边界</div>`;$('#modelExplain').innerHTML=`<h3>${method}</h3><p>${reason}</p><div class="warning"><strong>必须检查：</strong>${check}</div>`;setResult('#modelStatus','#modelAnswer',`推荐工具：${method}。理由：${reason}。`);}
    $('#modelTypes').addEventListener('click',e=>{const b=e.target.closest('[data-model]');if(!b)return;modelType=b.dataset.model;$$('#modelTypes .seg-btn').forEach(x=>x.classList.toggle('active',x===b));renderModel();});renderModel();

    // Navigation
    const sidebar=$('#sidebar'),overlay=$('#overlay');
    function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('open');}
    $('#menuBtn').addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',closeMenu);
    $$('.nav-link').forEach(link=>link.addEventListener('click',closeMenu));
    const sectionObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;$$('.nav-link').forEach(link=>link.classList.toggle('active',link.getAttribute('href')==='#'+visible.target.id));$('#topMeta').textContent=visible.target.querySelector('h1,h2')?.textContent||'数论专题';},{rootMargin:'-16% 0px -70% 0px',threshold:[0,.2,.5]});
    $$('.chapter').forEach(section=>sectionObserver.observe(section));
  </script>
</body>
</html>
